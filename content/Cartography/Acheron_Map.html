                        [phi, 0, 1], // 8: front right
                        [-phi, 0, 1], // 9: front left
                        [phi, 0, -1], // 10: back right
                        [-phi, 0, -1], // 11: back left
                    ].map((rawVertex) => {
                        // Normalize and scale to MAGINOT_PERIMETER_RADIUS
                        const vertexLength = Math.sqrt(
                            rawVertex[0] ** 2 +
                                rawVertex[1] ** 2 +
                                rawVertex[2] ** 2,
                        );
                        return [
                            (rawVertex[0] * MAGINOT_PERIMETER_RADIUS) /
                                vertexLength,
                            (rawVertex[1] * MAGINOT_PERIMETER_RADIUS) /
                                vertexLength,
                            (rawVertex[2] * MAGINOT_PERIMETER_RADIUS) /
                                vertexLength,
                        ];
                    });

                    // 20 faces - correctly connecting adjacent vertices
                    // Based on Three.js IcosahedronGeometry standard vertex ordering
                    const indices = [
                        0, 11, 5, 0, 5, 1, 0, 1, 7, 0, 7, 10, 0, 11, 6, 6, 7, 2,
                        6, 2, 5, 11, 10, 2, 11, 2, 1, 6, 5, 3, 3, 5, 4, 2, 3, 4,
                        7, 3, 4, 4, 3, 8, 10, 8, 4, 6, 8, 10, 1, 8, 4, 11, 9, 8,
                        11, 1, 9, 1, 5, 9, 7, 9, 5, 10, 9, 7,
                    ];

                    const icoGeometry = new THREE.IcosahedronGeometry(1, 0);
                    icoGeometry.scale(
                        MAGINOT_PERIMETER_RADIUS,
                        MAGINOT_PERIMETER_RADIUS,
                        MAGINOT_PERIMETER_RADIUS,
                    );
                    // Update vertex positions after scaling
                    const positionAttribute = icoGeometry.attributes.position;
                    for (let i = 0; i < positionAttribute.count; i++) {
                        const vertexX = positionAttribute.getX(i);
                        const vertexY = positionAttribute.getY(i);
                        const vertexZ = positionAttribute.getZ(i);
                        const vertexLength = Math.sqrt(
                            vertexX ** 2 + vertexY ** 2 + vertexZ ** 2,
                        );
                        positionAttribute.setXYZ(
                            i,
                            (vertexX / vertexLength) * MAGINOT_PERIMETER_RADIUS,
                            (vertexY / vertexLength) * MAGINOT_PERIMETER_RADIUS,
                            (vertexZ / vertexLength) * MAGINOT_PERIMETER_RADIUS,
                        );
                    }
                    positionAttribute.needsUpdate = true;
                    icoGeometry.computeVertexNormals();

                    this.maginotGroup = new THREE.Group();
                    // SKEWED COUNTER ROTATION: Rotates opposite to Birch World, tilted like a gyroscope
                    this.maginotGroup.userData = {
                        rotationAxis: new THREE.Vector3(
                            0.5,
                            -1.0,
                            0.3,
                        ).normalize(),
                        rotationSpeed: 0.017,
                    };

                    // === HIGH-FIDELITY VISUAL FLOOR STARS ===
                    // Visual Floor Shader: Maintains constant screen size regardless of distance

                    // Enhanced Vertex shader with shader-based glow (replaces lensflare)
                    const starVertexShader = `
                        #include <common>
                        #include <logdepthbuf_pars_vertex>

                        uniform float cameraDistance;
                        uniform float minPixelSize;
                        uniform float maxPixelSize;
                        uniform float glowIntensity;
                        varying float vOpacity;
                        varying float vDistanceFactor;

                        void main() {
                            vec4 worldPos = modelMatrix * vec4(position, 1.0);
                            vec4 viewPos = modelViewMatrix * vec4(position, 1.0);
                            gl_Position = projectionMatrix * viewPos;

                            #include <logdepthbuf_vertex>

                            float dist = length(-viewPos.xyz);

                            // Visual Floor: gl_PointSize stays constant at min size when zoomed out
                            float sizeAtDistance = minPixelSize * (cameraDistance / dist);
                            float finalSize = max(minPixelSize, min(sizeAtDistance, maxPixelSize));

                            gl_PointSize = finalSize;

                            // Fade opacity when behind Birch World
                            vOpacity = step(0.0, gl_Position.z);

                            // Calculate distance factor for glow intensity falloff
                            vDistanceFactor = 1.0 - smoothstep(0.0, cameraDistance * 2.0, dist);
                            vDistanceFactor = clamp(vDistanceFactor, 0.0, 1.0);
                        }
                    `;

                    // Fragment shader with built-in glow/aura effect (replaces lensflare elements)
                    const starFragmentShader = `
                        #include <common>
                        #include <logdepthbuf_pars_fragment>

                        uniform vec3 starColor;
                        uniform vec3 glowColor;
                        uniform float glowIntensity;
                        varying float vOpacity;
                        varying float vDistanceFactor;

                        void main() {
                            #include <logdepthbuf_fragment>

                            vec2 center = gl_PointCoord - vec2(0.5);
                            float dist = length(center);

                            if (dist > 0.6) {
                                discard;
                            }

                            // Core star with radial gradient
                            float coreAlpha = 1.0 - smoothstep(0.0, 0.5, dist);
                            vec3 coreColor = starColor * coreAlpha;

                            // Outer glow/aura with larger spread and falloff
                            float glowDist = dist * 2.5;
                            float glowAlpha = (1.0 - smoothstep(0.0, 0.8, glowDist)) * vDistanceFactor * glowIntensity;
                            vec3 glowColorWithAlpha = glowColor * glowAlpha * 0.6;

                            // Combine core and glow
                            vec3 finalColor = coreColor + glowColorWithAlpha;
                            float finalAlpha = max(coreAlpha * vOpacity, glowAlpha * vOpacity);

                            gl_FragColor = vec4(finalColor, finalAlpha);
                            #include <colorspace_fragment>
                        }
                    `;

                    const starMaterial = new THREE.ShaderMaterial({
                        uniforms: {
                            cameraDistance: { value: 5.0 },
                            minPixelSize: { value: 2.0 },
                            maxPixelSize: { value: 8.0 },
                            glowIntensity: { value: 1.2 },
                            starColor: { value: new THREE.Color(0xaabfff) },
                            glowColor: { value: new THREE.Color(0x6688ff) },
                        },
                        vertexShader: starVertexShader,
                        fragmentShader: starFragmentShader,
                        transparent: true,
                        depthTest: true,
                        depthWrite: false,
                    });

                    // Create 12 visual floor star points at icosahedron vertices
                    const starGeometry = new THREE.BufferGeometry();
                    const starPositions = [];

                    // Use the unique normalizedIcosahedronVertices instead of positionAttribute
                    for (
                        let i = 0;
                        i < normalizedIcosahedronVertices.length;
                        i++
                    ) {
                        starPositions.push(
                            normalizedIcosahedronVertices[i][0],
                            normalizedIcosahedronVertices[i][1],
                            normalizedIcosahedronVertices[i][2],
                        );
                    }
                    starGeometry.setAttribute(
                        "position",
                        new THREE.Float32BufferAttribute(starPositions, 3),
                    );

                    this.maginotStars = new THREE.Points(
                        starGeometry,
                        starMaterial,
                    );
                    this.maginotStars.renderOrder = 4;
                    this.maginotGroup.add(this.maginotStars);

                    // === LENS FLARE AURAS ===
                    // Attach flares to point lights with True Scale sizing
                    // Store initial positions and light references for manual 64-bit rotation
                    this.maginotStarsArray = [];
                    this.maginotInitialPositions = [];

                    for (
                        let i = 0;
                        i < normalizedIcosahedronVertices.length;
                        i++
                    ) {
                        const starPosition = new THREE.Vector3(
                            normalizedIcosahedronVertices[i][0],
                            normalizedIcosahedronVertices[i][1],
                            normalizedIcosahedronVertices[i][2],
                        );

                        const starColor = new THREE.Color(0xaabfff);

                        // Point light provides local illumination
                        const light = new THREE.PointLight(starColor, 5, 20);
                        light.position.copy(starPosition);
                        light.intensity = 0.5;
                        light.distance = 10;
                        light.decay = 2;
                        light.castShadow = false;
                        light.depthTest = true;
                        light.depthWrite = false;

                        // Remove lensflare - replaced by shader-based glow effect
                        // Keep point light for local illumination
                        this.maginotStarsArray.push(light);
                        this.maginotInitialPositions.push({
                            x: normalizedIcosahedronVertices[i][0],
                            y: normalizedIcosahedronVertices[i][1],
                            z: normalizedIcosahedronVertices[i][2],
                        });
                    }

                    // === RELATIVISTIC TETHERS ===
                    const tetherGeo = new THREE.EdgesGeometry(icoGeometry);
                    const tetherMat = new THREE.ShaderMaterial({
                        uniforms: {
                            time: { value: 0 },
                            baseColor: { value: new THREE.Color(0x4488ff) },
                        },
                        vertexShader: `
                                        #include <common>
                                        #include <logdepthbuf_pars_vertex>
                                        uniform float time;
                                        varying float vDist;
                                        void main() {
                                            vDist = length(position);
                                            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                                            #include <logdepthbuf_vertex>
                                        }
                                    `,
                        fragmentShader: `
                                        #include <common>
                                        #include <logdepthbuf_pars_fragment>
                                        uniform vec3 baseColor;
                                        uniform float time;
                                        void main() {
                                            #include <logdepthbuf_fragment>
                                            float pulse = sin(time * 3.0) * 0.5 + 0.5;
                                            gl_FragColor = vec4(baseColor, 0.3 + pulse * 0.2);
                                            #include <colorspace_fragment>
                                        }
                                    `,
                        transparent: true,
                        blending: THREE.AdditiveBlending,
                        depthTest: true,
                        depthWrite: false,
                    });
                    const tethers = new THREE.LineSegments(
                        tetherGeo,
                        tetherMat,
                    );
                    tethers.renderOrder = 2;
                    this.maginotGroup.add(tethers);
                    this.maginotTethers = { material: tetherMat };

                    // === HARD-LIGHT SHIELD SKIN ===
                    const shieldMat = new THREE.MeshBasicMaterial({
                        color: 0x3344aa,
                        transparent: true,
                        opacity: 0.08,
                        side: THREE.BackSide,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false,
                    });
                    const shield = new THREE.Mesh(icoGeometry, shieldMat);
                    shield.renderOrder = 3;
                    shield.frustumCulled = true;
                    this.maginotGroup.add(shield);
                    this.maginotShield = shield;

                    this.scene.add(this.maginotGroup);
                }

                // ========== MAGINOT PERIMETER ANIMATION ==========
                animateMaginotPerimeter(deltaTime, elapsedTime) {
                    if (!this.maginotGroup) return;

                    // Counter-rotate the entire shield cage (tethers and shield still use group)
                    const axis = this.maginotGroup.userData.rotationAxis;
                    const speed = this.maginotGroup.userData.rotationSpeed;
                    this.maginotGroup.rotateOnWorldAxis(
                        axis,
                        speed * deltaTime,
                    );

                    // Only calculate Maginot star math if visible
                    if (this.maginotGroup.visible) {
                        // MANUAL ROTATION FOR STARS TO PRESERVE FP64 PRECISION
                        // JavaScript uses FP64 for Math operations; convert to 32-bit float only for WebGL positions
                        // Prevents precision drift from accumulated floating-point errors
                        if (
                            this.maginotStarsArray &&
                            this.maginotStarsArray.length > 0
                        ) {
                            const angleY =
                                (elapsedTime % (Math.PI * 2)) * 0.001;
                            const angleZ =
                                (elapsedTime % (Math.PI * 2)) * 0.0005;

                            const qY =
                                this._tempVectors.qYawCached.setFromAxisAngle(
                                    GLOBAL_AXES.axisY,
                                    angleY,
                                );
                            const qZ =
                                this._tempVectors.qPitchCached.setFromAxisAngle(
                                    GLOBAL_AXES.axisZ,
                                    angleZ,
                                );

                            for (
                                let i = 0;
                                i < this.maginotStarsArray.length;
                                i++
                            ) {
                                const star = this.maginotStarsArray[i];
                                const initial = this.maginotInitialPositions[i];

                                const rotated = this._tempVectors.maginotScratch
                                    .set(initial.x, initial.y, initial.z)
                                    .applyQuaternion(qY)
                                    .applyQuaternion(qZ);

                                star.position.copy(rotated);
                            }
                        }

                        // Pulse the tethers shader time uniform
                        if (
                            this.maginotTethers &&
                            this.maginotTethers.material &&
                            this.maginotTethers.material.uniforms.time
                        ) {
                            this.maginotTethers.material.uniforms.time.value =
                                elapsedTime;
                        }
                    }
                }

                // ========== MAGINOT PERIMETER VISIBILITY =========
                updateMaginotVisibility() {
                    if (!this.maginotGroup || !this.camera) return;

                    // Calculate absolute positions using floatingOffset for accurate distance measurement
                    // Use squared distance to avoid expensive Math.sqrt()
                    const cameraAbsolute = this._tempVectors.cameraAbsolute
                        .copy(this.camera.position)
                        .add(this.floatingOffset);

                    const maginotAbsolute = this._tempVectors.birchAbsolute
                        .copy(this.maginotGroup.position)
                        .add(this.floatingOffset);
                    const trueDistSq =
                        cameraAbsolute.distanceToSquared(maginotAbsolute);
                    const isVisible = trueDistSq < 22500; // 150 * 150

                    // Toggle visibility of all Maginot components when distance threshold crossed
                    if (this.maginotGroup.visible !== isVisible) {
                        this.maginotGroup.visible = isVisible;
                    }
                    if (
                        this.maginotShield &&
                        this.maginotShield.visible !== isVisible
                    ) {
                        this.maginotShield.visible = isVisible;
                    }
                }

                animateBirchWorld(deltaTime, elapsedTime) {
                    // Rotate the entire Birch World on the Y axis
                    if (this.birchWorldGroup) {
                        this.birchWorldGroup.rotation.y +=
                            this.birchWorldGroup.userData.rotationSpeed *
                            deltaTime;
                    }

                    // Float the individual armor plates inward/outward (only if visible)
                    if (
                        this.armorPlates &&
                        this.armorPlates.length > 0 &&
                        this.armorPlates[0].visible
                    ) {
                        for (let i = 0; i < this.armorPlates.length; i++) {
                            const plate = this.armorPlates[i];
                            const plateUserData = plate.userData;
                            if (plateUserData) {
                                const floatPhase =
                                    plateUserData.floatOffset +
                                    elapsedTime * plateUserData.speed;
                                const floatAmount =
                                    Math.sin(floatPhase) * 0.002;
                                plate.position
                                    .copy(plateUserData.initialPosition)
                                    .addScaledVector(
                                        plateUserData.dir,
                                        floatAmount,
                                    );
                            }
                        }
                    }
                }

                // ========== FRUSTUM CULLING ==========
                updateBirchWorldVisibility() {
                    if (
                        !this.armorPlates ||
                        !this.camera ||
                        !this.birchWorldGroup
                    )
                        return;

                    // Calculate absolute positions using floatingOffset for accurate distance measurement
                    // Use pre-allocated vectors to avoid per-frame allocations
                    const cameraAbsolute = this._tempVectors.cameraAbsolute
                        .copy(this.camera.position)
                        .add(this.floatingOffset);
                    const birchAbsolute = this._tempVectors.birchAbsolute
                        .copy(this.birchWorldGroup.position)
                        .add(this.floatingOffset);
                    const trueDistSq =
                        cameraAbsolute.distanceToSquared(birchAbsolute);

                    // Armor plates visibility: within 300 ly
                    const platesVisible = trueDistSq < 90000; // 300 * 300

                    // Core and glow visibility: within 800 ly
                    const coreGlowVisible = trueDistSq < 640000; // 800 * 800

                    // Show plates only when close to the Birch World (e.g., within 300 ly)
                    for (let i = 0; i < this.armorPlates.length; i++) {
                        const plate = this.armorPlates[i];
                        if (plate.visible !== platesVisible) {
                            plate.visible = platesVisible;
                        }
                    }

                    // Hide core and glow when beyond 800 ly
                    if (this.birchWorldGroup.children) {
                        for (
                            let i = 0;
                            i < this.birchWorldGroup.children.length;
                            i++
                        ) {
                            const child = this.birchWorldGroup.children[i];
                            // Hide core and glow meshes (skip armor plates)
                            if (
                                child === this.core ||
                                child === this.glow ||
                                child.userData.isBirchCore ||
                                child.userData.isBirchGlow
                            ) {
                                if (child.visible !== coreGlowVisible) {
                                    child.visible = coreGlowVisible;
                                }
                            }
                        }
                    }
                }

                updateCameraTransition(deltaTime) {
                    const t = this.cameraTransition;
                    t.progress += deltaTime * 2.0;

                    if (t.progress >= 1) {
                        t.progress = 1;
                        t.active = false;
                        // Only set quaternion - OrbitControls handles target automatically
                        this.camera.quaternion.copy(t.endRot);
                        // Re-enable OrbitControls after transition completes
                        this.controls.enabled = true;
                        // Enable the toggle button
                        this.ui.dom.toggleBtn.disabled = false;
                    } else {
                        this.camera.quaternion.slerpQuaternions(
                            t.startRot,
                            t.endRot,
                            t.progress,
                        );
                    }
                    this.camera.updateMatrixWorld();
                }

                updateMovement(deltaTime, camAbs, camDistSq) {
                    if (this.cameraTransition.active) return;
                    const camera = this.camera;
                    const { activeActionState, movementSpeed } = this.input;

                    const moveAmount = movementSpeed * deltaTime * 60;
                    const rollAmount =
                        ENGINE_SETTINGS.movement.rollSpeed * deltaTime;

                    if (activeActionState.rollLeft) camera.rotateZ(rollAmount);
                    if (activeActionState.rollRight)
                        camera.rotateZ(-rollAmount);

                    // Use pre-computed absolute position to avoid redundant vector operations
                    const pos =
                        camAbs ||
                        this._tempVectors.absolutePos
                            .copy(camera.position)
                            .add(this.floatingOffset);
                    const distanceSquared = camDistSq || pos.lengthSq();

                    // Use optimized built-in translate methods (reduces vector ops and quaternion mult)
                    // Explicitly cast booleans to 1 or 0 to guarantee mathematical safety
                    const moveZ =
                        (activeActionState.backward ? 1 : 0) -
                        (activeActionState.forward ? 1 : 0);
                    const moveX =
                        (activeActionState.strafeRight ? 1 : 0) -
                        (activeActionState.strafeLeft ? 1 : 0);
                    if (moveZ !== 0 || moveX !== 0) {
                        camera.translateZ(moveZ * moveAmount);
                        camera.translateX(moveX * moveAmount);
                    }

                    // Remove redundant distance bounds check - OrbitControls already enforces min/maxDistance

                    this.input.consumeMouseDelta(this._tempVectors.mouseDelta);
                    const dx = this._tempVectors.mouseDelta.x;
                    const dy = this._tempVectors.mouseDelta.y;
                    if (dx !== 0 || dy !== 0) {
                        // O(1) quaternion rotation without allocateOnWorldAxis
                        const yawAngle =
                            -dx * ENGINE_SETTINGS.movement.turnSpeed;
                        const pitchAngle =
                            -dy * ENGINE_SETTINGS.movement.turnSpeed;

                        // Use pre-allocated quaternions to avoid per-frame allocations
                        this._tempVectors.qYaw.setFromAxisAngle(
                            GLOBAL_AXES.axisY,
                            yawAngle,
                        );
                        this._tempVectors.qPitch.setFromAxisAngle(
                            GLOBAL_AXES.axisX,
                            pitchAngle,
                        );
                        this.camera.quaternion
                            .multiply(this._tempVectors.qYaw)
                            .multiply(this._tempVectors.qPitch);
                    }
                }

                updateEnvironment(deltaTime, elapsedTime) {
                    // Pre-compute frame normalizer to reduce ALU operations per frame
                    const frameNormalizedDelta = deltaTime * 60;

                    // Batch rotation updates to minimize property access overhead
                    const shells = this.rotatingShells;
                    const shellCount = shells.length;

                    for (let i = 0; i < shellCount; i++) {
                        const shell = shells[i];
                        const speed = shell.userData.rotationSpeed;
                        const xSpeed = speed.x * frameNormalizedDelta;
                        const ySpeed = speed.y * frameNormalizedDelta;
                        shell.rotation.x += xSpeed;
                        shell.rotation.y += ySpeed;
                    }

                    // Animate birch world plates and lights
                    if (this.armorPlates && this.birchWorldGroup) {
                        this.updateBirchWorldVisibility();
                        this.animateBirchWorld(deltaTime, elapsedTime);
                    }

                    // Animate Maginot Defense Perimeter
                    if (this.maginotGroup) {
                        this.updateMaginotVisibility();
                        this.animateMaginotPerimeter(deltaTime, elapsedTime);
                    }

                    // Update warble shell time uniform
                    for (const shell of this.rotatingShells) {
                        if (
                            shell.userData.warbleMaterial &&
                            shell.userData.warbleMaterial.uniforms.time
                        ) {
                            shell.userData.warbleMaterial.uniforms.time.value =
                                elapsedTime;
                        }
                    }

                    // Update BirchWorld core shader uniforms (glow uniform updates not active)
                    if (
                        this.birchWorldGroup &&
                        this.coreMaterial &&
                        this.coreMaterial.uniforms?.time
                    ) {
                        this.coreMaterial.uniforms.time.value = elapsedTime;
                    }
                }

                animate = () => {
                    if (this._disposed) return;
                    this._rafId = requestAnimationFrame(this.animate);

                    const now = performance.now();
                    const deltaTime = Math.min(
                        (now - this._lastTime) / 1000,
                        0.1,
                    );
                    this._lastTime = now;
                    this._elapsedTime += deltaTime;
                    const elapsedTime = this._elapsedTime;
                    const isTransitioning = this.cameraTransition.active;

                    // --- Floating Origin Check ---
                    if (
                        this.camera.position.lengthSq() >
                        this.FLOATING_ORIGIN_TRIGGER_DISTANCE *
                            this.FLOATING_ORIGIN_TRIGGER_DISTANCE
                    ) {
                        this.shiftOrigin();
                    }
                    // -----------------------------

                    // HOISTED: Calculate absolute camera state once per frame to avoid redundant vector ops
                    const camAbs = this._tempVectors.cameraAbsolute
                        .copy(this.camera.position)
                        .add(this.floatingOffset);
                    const camDistSq = camAbs.lengthSq();

                    if (this.input.isExplorationMode) {
                        this.updateMovement(deltaTime, camAbs, camDistSq);
                    } else if (isTransitioning) {
                        this.updateCameraTransition(deltaTime);
                    } else {
                        this.controls.update();
                    }

                    this.updateEnvironment(deltaTime, elapsedTime);

                    // Render with bloom post-processing if composer exists
                    if (this.effectComposer) {
                        this.effectComposer.render();
                    } else {
                        this.renderer.render(this.scene, this.camera);
                    }

                    // Use cached distance - avoid sqrt in hot path
                    const camera = this.camera;
                    // Distance changes slowly; use cached value updated every 4 frames
                    // 25% reduction in sqrt operations at cost of slight UI update latency
                    // sqrt() is expensive; distance only changes significantly at high velocities
                    if (this._uiFrameCount % 4 === 0) {
                        this._lastCalculatedDistance = Math.sqrt(camDistSq);
                    }
                    const distance = this._lastCalculatedDistance;

                    // Update bloom intensity based on camera distance
                    if (this.effectComposer && this.bloomPass) {
                        const distanceFactor = Math.max(
                            0,
                            1 - distance / 50000,
                        );
                        this.bloomPass.strength = 0.2 + 0.3 * distanceFactor;
                        this.bloomPass.threshold =
                            0.4 + 0.5 * (1 - distanceFactor);
                        this.bloomPass.radius = 0.1 + 0.2 * distanceFactor;
                    }

                    // Calculate speed only when needed for navigation (in exploration mode)
                    let isExplorationMode = this.input.isExplorationMode;

                    // Throttle UI updates to every 2 frames to reduce layout/paint
                    if (this._uiFrameCount++ % 2 === 0) {
                        const displayedSpeed =
                            isExplorationMode && !isTransitioning
                                ? Math.round(this.input.movementSpeed * 60)
                                : 0;
                        this.ui.updateHUD(
                            distance,
                            displayedSpeed,
                            isExplorationMode && !isTransitioning,
                        );
                    }
                };

                dispose() {
                    if (this._disposed) return;
                    this._disposed = true;

                    // Cancel animation frame to prevent orphaned loop execution
                    if (this._rafId) {
                        cancelAnimationFrame(this._rafId);
                    }
                    if (this._resizeTimeoutId) {
                        clearTimeout(this._resizeTimeoutId);
                        this._resizeTimeoutId = null;
                    }

                    // Cleanup event listeners to prevent memory leaks
                    // Remove WebGL context event listeners from canvas
                    const canvas = this.renderer?.domElement;
                    if (canvas) {
                        canvas.removeEventListener(
                            "webglcontextlost",
                            this._onContextLostHandler,
                            false,
                        );
                        canvas.removeEventListener(
                            "webglcontextrestored",
                            this._onContextRestoredHandler,
                            false,
                        );
                    }

                    window.removeEventListener("resize", this._handleResize);

                    // Dispose Birch World meshes (shattered core megastructure)
                    if (this.armorPlates) {
                        this.armorPlates.forEach((plate) => {
                            plate.geometry.dispose();
                            if (Array.isArray(plate.material)) {
                                plate.material.forEach((m) => m.dispose());
                            } else {
                                plate.material.dispose();
                            }
                        });
                    }
                    if (this.birchWorldGroup) {
                        // Dispose core and glow meshes
                        this.birchWorldGroup.children.forEach((child) => {
                            if (child.geometry) child.geometry.dispose();
                            if (child.material) {
                                if (Array.isArray(child.material)) {
                                    child.material.forEach((m) => m.dispose());
                                } else {
                                    child.material.dispose();
                                }
                            }
                        });
                    }

                    // Dispose Main Star System - CRITICAL: Prevent GPU VRAM leak from 150k stars
                    if (this.stars) {
                        this.stars.geometry.dispose();
                        this.stars.material.dispose();
                        this.stars = null;
                    }

                    // Dispose Maginot Defense Perimeter meshes and materials
                    if (this.maginotGroup) {
                        this.maginotGroup.children.forEach((child) => {
                            if (child.geometry) child.geometry.dispose();
                            if (child.material) {
                                if (Array.isArray(child.material)) {
                                    child.material.forEach((m) => m.dispose());
                                } else {
                                    child.material.dispose();
                                }
                            }
                        });
                    }

                    // Dispose Maginot Tethers material if present
                    if (this.maginotTethers?.material) {
                        this.maginotTethers.material.dispose();
                    }

                    for (const shell of this.rotatingShells) {
                        shell.geometry.dispose();
                        shell.material.dispose();
                    }

                    // Clean up warble shell materials
                    for (const shell of this.rotatingShells) {
                        if (shell.userData.warbleMaterial) {
                            shell.userData.warbleMaterial.dispose();
                        }
                    }

                    // Dispose effect composer passes
                    if (this.effectComposer) {
                        for (const pass of this.effectComposer.passes) {
                            if (pass.dispose) {
                                pass.dispose();
                            }
                        }
                        // Explicitly release composer references
                        this.effectComposer = null;
                    }

                    // Remove canvas from DOM to prevent memory leaks in SPA context
                    if (
                        this.renderer.domElement &&
                        this.renderer.domElement.parentNode
                    ) {
                        this.renderer.domElement.parentNode.removeChild(
                            this.renderer.domElement,
                        );
                    }

                    this.renderer.dispose();

                    // Clean up input event listeners (prevent memory leaks)
                    if (this.input) {
                        this.input.dispose();
                    }

                    // Remove toggle button handler
                    if (this._toggleHandler) {
                        this.ui.dom.toggleBtn.removeEventListener(
                            "click",
                            this._toggleHandler,
                        );
                    }

                    // Clean up OrbitControls
                    if (this.controls) {
                        this.controls.dispose();
                    }

                    // Clear scene to ensure all scene-managed objects are released
                    this.scene.clear();

                    // Release references for faster garbage collection
                    this.rotatingShells.length = 0;
                    this.maginotGroup = null;
                    this.maginotStars = null;
                    this.maginotStarsArray = null;
                    this.maginotInitialPositions = null;
                    this.maginotTethers = null;
                    this.scene = null;
                    this.camera = null;
                    this.renderer = null;
                    this.controls = null;
                    this.ui = null;
                    this.input = null;
                    window.engine = null;
                }
            }

            // Boot Application
            window.addEventListener("DOMContentLoaded", () => {
                window.engine = new GalaxyEngine();
            });

            // Ensure cleanup on page unload
            window.addEventListener("beforeunload", () => {
                if (window.engine) {
                    window.engine.dispose();
                }
            });
        </script>
    </body>
</html>
